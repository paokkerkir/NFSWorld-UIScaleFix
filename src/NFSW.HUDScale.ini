[MAIN]
UIScale = 0                  ; HUD/menu scale factor. 0 = auto (screen height / BaseHeight), e.g. 1440p -> 1.33, 2160p -> 2.0
BaseHeight = 768            ; Resolution height the UI was designed for when UIScale = 0. Lower = bigger UI.
MinScale = 1.0               ; Never scale below this.
ScaleFullscreenMovies = 1    ; Scale full-screen menus that use Flash "noScale" mode.
ScaleWindowMovies = 1        ; Scale HUD pieces / windows that the game places as pixel-sized rectangles.
ExcludeSizes =               ; Comma-separated game viewport sizes (as logged in game=[x,y WxH]) to leave untouched, e.g. 256x32
ScreenRectCallers =          ; Extra GetViewport caller addresses (hex, from the log) that should see the on-screen rect (mouse code).
ScaleTopBar = 1               ; Scale the top button bar (CommonHUD). 0 = leave at original size.
ScalePowerupWheel = 1         ; Scale the power-up wheel (powerup). 0 = leave at original size.
TooltipScale = 0.7           ; Tooltip size relative to the UI scale (TooltipMovies). 1.0 = same as UI, 0.75 = 75% of it, 1.25 = 125%. Never below original size.
FixMenuTooltips = 1          ; Place menu tooltips and item info popups (aftermarket, performance parts, skill mods) correctly inside scaled menus. 0 = off.

; --- movies by GFX file name (comma-separated, without .gfx; names are listed in the log as "movie loaded: ...") ---
TooltipMovies = Tooltip,Tooltip_powerupManagement   ; Enlarged (TooltipScale) at the game's spot: same centre x, same top.
TopLeftMovies = ContextMenu,DropdownMenu            ; Enlarged keeping the game's top-left corner (pop-up menus opened at the cursor).
ScaleNameBadges = 1                                 ; 1 = scale car name tags (InPlaceMovies) around their own centre. 0 = original size.
InPlaceMovies = PlayerNameBadge                     ; Movies scaled around their own centre when ScaleNameBadges = 1.
ExcludeMovies = WorldMap                            ; Movies never scaled (WorldMap = the resizable world map window).
ContentOnlyMovies =                                 ; Movies whose window is left to the game, only content enlarged.
RememberWindowPositions = 1                         ; Remember where you drag windows (saved in NFSW.HUDScale.positions.ini; delete it to reset).

; --- cursor ---
HideCursorInGame = 1                                ; 1 = hide the mouse cursor while driving (HUD only on screen) after HideCursorDelay seconds without mouse movement. Menus always keep it.
HideCursorDelay = 5                                 ; Seconds of mouse inactivity before the cursor is hidden.
HudMovies = InstrumentCluster,CommonHud,flashers,powerup,PowerupBuffBar,BuffBar,ChatGadget,GroupChatHUD,ChatGroupSelect,TreasureHud,DriveIndicator,RaceGadget,Tooltip,PlayerNameBadge,_Overlay,MeetingPlaceHUD,DragRaceHUD,SprintRankingIndicator,CircuitRankingIndicator,PursuitIndicator,TeamEscapePursuitIndicator,PursuitOutrunRankingIndicator,MultiplayerPursuitHUD,TrackerHUD,TickerGadget,RaceCountdownTimer,LevelUpFlasher,Font-ENG,Font-CHS,Font-CHT,Font-THA,Global,Common,IME,Dummy   ; Movies that count as HUD (not a menu) for HideCursorInGame. The log shows 'cursor: menu open (Name)' if something else keeps the cursor.

; --- debug ---
DebugMouseMovies =           ; Log which movies receive each mouse click (names, * = all). Diagnostics only - leave empty normally.
DebugMouseStage =            ; Log mouse routing for this movie stage (diagnostics). Empty = off.
Log = 0                      ; 1 = write NFSW.HUDScale.log next to the .asi (every viewport the game sets) - for troubleshooting.
